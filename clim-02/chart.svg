<title id="t">Warming avoided by 2100 if each country or group reached net-zero CO2</title>
<desc id="d">Grouped bar chart. Medium and High CMIP7-style scenarios. China and India each avoid more warming than the U.S.; all four together avoid about 0.6 to 1.0 C; the rest of the world avoids slightly more than all four.</desc>
<rect width="1000" height="650" fill="#ffffff"/>
<text x="20" y="34" font-size="22" font-weight="700" fill="#0b0b0b">Who actually moves global temperature? Warming avoided by 2100 at net-zero CO₂</text>
<text x="20" y="58" font-size="14" fill="#52514e">Each country or group goes to net-zero now; the rest of the world stays on the same path. Whiskers = likely range.</text>
